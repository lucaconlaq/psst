[package]
name = "psst"
version = "2.0.0-beta.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/lucaconlaq/psst"
rust-version = "1.88"
description = "A local secret-reference manager and parallel environment wrapper"

[dependencies]
anyhow = "1"
crossterm = { version = "0.28", features = ["event-stream"] }
data-encoding = "2"
fs2 = "0.4"
futures = "0.3"
hmac = "0.12"
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
url = "2"
zeroize = "1"

[dev-dependencies]
assert_cmd = "2"
dotenvy = "0.15"
vt100 = "0.15"

[profile.release]
lto = "thin"
strip = true
