[package]
name = "psst"
version = "2.0.0-alpha.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/lucaconlaq/psst"
rust-version = "1.88"
description = "A local secret-reference manager and parallel environment wrapper"

[dependencies]
aes = { version = "0.8.4", features = ["zeroize"] }
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
anyhow = "1"
crossterm = { version = "0.28", features = ["event-stream"] }
data-encoding = "2"
ed25519-dalek = "2.2"
fs2 = "0.4"
futures = "0.3"
ghash = { version = "0.5.1", features = ["zeroize"] }
hkdf = "0.12.4"
hmac = "0.12"
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
polyval = { version = "0.6.2", features = ["zeroize"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
url = "2"
zeroize = "1"

[dev-dependencies]
assert_cmd = "2"
dotenvy = "0.15"
ed25519-dalek = { version = "2.2", features = ["hazmat"] }
vt100 = "0.15"

[profile.release]
lto = "thin"
strip = true
