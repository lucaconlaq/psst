name: CI and Release

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify release tag matches package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "psst") | .version')
          if [ "$TAG" != "v$version" ]; then
            echo "Release tag $TAG must match Cargo.toml version v$version" >&2
            exit 1
          fi
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target "${{ matrix.target }}"
      - name: Test
        timeout-minutes: 10
        run: cargo +stable test --locked --target "${{ matrix.target }}" -- --nocapture
      - name: Build
        run: cargo +stable build --locked --release --target "${{ matrix.target }}"
      - name: Package release archive
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          archive="psst-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" psst
      - name: Upload release artifact
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: psst-${{ matrix.target }}
          path: psst-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: psst-*
          path: dist
          merge-multiple: true
      - name: Prepare draft release
        run: |
          if gh release view "$TAG" --json isDraft > release.json; then
            jq -e '.isDraft' release.json
          else
            gh release create "$TAG" --draft --verify-tag --generate-notes
          fi
      - name: Publish release
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          gh release upload "$TAG" *.tar.gz SHA256SUMS --clobber
          prerelease=false
          latest=true
          if [[ "$TAG" == *-* ]]; then
            prerelease=true
            latest=false
          fi
          gh release edit "$TAG" --draft=false --prerelease="$prerelease" --latest="$latest"
